name: update-formula

on:
  # Primary path: starjj's release workflow fires this when a release is published.
  repository_dispatch:
    types: [starjj-release]
  # Manual / instant: run from the Actions tab, optionally pinning a specific tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to pin (default: latest)"
        required: false
  # Backstop: catch releases even if the dispatch never arrives.
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/gen-formula.sh "${{ github.event.inputs.tag || github.event.client_payload.tag }}"

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/starjj.rb; then
            echo "Formula already up to date."
            exit 0
          fi
          version="$(grep -m1 'version "' Formula/starjj.rb | sed -E 's/.*"(.*)".*/\1/')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/starjj.rb
          git commit -m "starjj ${version}"
          git push
